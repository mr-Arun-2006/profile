# Core application
APP_NAME=AI Forge
APP_ENV=development
APP_DEBUG=true
APP_PORT=8000
SECRET_KEY=change-me-in-production

# Database
DATABASE_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/ai_forge

# Model providers
NVIDIA_API_KEY=your_nvidia_api_key
NVIDIA_BASE_URL=https://integrate.api.nvidia.com/v1
OPENROUTER_API_KEY=your_openrouter_api_key
OPENROUTER_BASE_URL=https://openrouter.ai/api/v1
LOCAL_NIM_BASE_URL=http://localhost:8000/v1

# GitHub
GITHUB_APP_ID=
GITHUB_APP_PRIVATE_KEY_PATH=/run/secrets/github_app_private_key
GITHUB_WEBHOOK_SECRET=your_webhook_secret
GITHUB_CLIENT_ID=
GITHUB_CLIENT_SECRET=

# Security
ALLOWED_REPO_HOSTS=github.com
SESSION_TIMEOUT_MINUTES=60

# Sandbox
WORKSPACE_ROOT=/workspaces
MAX_WORKSPACE_SIZE_GB=10

# Frontend
VITE_API_BASE_URL=http://localhost:8000
